name: Compile Branded Multi-OS Production Artifacts

on:
  # NOTE: this repo has immutable releases enabled, so assets can only be
  # attached BEFORE a release is published. GitHub also suppresses release
  # events for draft releases, so this workflow triggers on TAG PUSH: it
  # creates a draft release, attaches all installers to the draft, then
  # publishes it once every build succeeded.
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Build variants. The configurator always ships BOTH variants per tag:
  #   prod  -> https://smalnets.com      deployed to the PRODUCTION server
  #   dev   -> https://smalnets.ddns.net deployed to the DEVELOPMENT server
  # Binary names embed the variant so a release can carry both and the
  # in-app updater can tell them apart (*-dev assets are never offered to
  # production installs).

jobs:
  # =========================================================================
  # 🏷️ CREATE-DRAFT JOB (ensure a draft release exists for the pushed tag)
  # =========================================================================
  create-draft:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Create draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" \
                 --draft --title "Release ${{ github.ref_name }}" --notes ""

  # =========================================================================
  # 🪟 WINDOWS COMPILATION JOB (Native Windows Server Hardware)
  # =========================================================================
  build-windows:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    name: Compile Branded Windows Executable (${{ matrix.variant }})
    runs-on: windows-latest
    needs: [create-draft]
    strategy:
      matrix:
        include:
          - { variant: prod, label: '',      api: 'https://smalnets.com',      deploy_host_secret: PROD_HOST, deploy_user_secret: PROD_USER }
          - { variant: dev,  label: '-dev',  api: 'https://smalnets.ddns.net', deploy_host_secret: VPS_HOST,  deploy_user_secret: VPS_USER }

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Windows Python Environment (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Windows Compilation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zstandard Nuitka PySide6 requests RouterOS-api imageio pillow

      - name: Generate Windows icon (logo.ico)
        shell: bash
        run: |
          python scripts/make_icon.py

      - name: Create version file
        shell: bash
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo -n "$V" > config_program/version.txt

      - name: Write build variant config
        shell: bash
        run: |
          cat > config_program/build_config.py <<EOF
          BASE_URL = '${{ matrix.api }}'
          VARIANT = '${{ matrix.variant }}'
          EOF

      - name: Set version and arch for output naming
        id: version_info
        shell: bash
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "arch=amd64" >> $GITHUB_OUTPUT

      - name: Compile Code to C++ Executable via Nuitka
        shell: bash
        run: |
          python -m nuitka --standalone \
              --onefile \
              --assume-yes-for-downloads \
              --plugin-enable=pyside6 \
              --windows-console-mode=disable \
              --output-dir=build \
              --windows-icon-from-ico=assets/images/logo.ico \
              --include-data-files=assets/images/logo.png=assets/images/logo.png \
              --include-data-files=config_program/version.txt=version.txt \
              --include-module=build_config \
              --follow-import-to=api \
              --follow-import-to=controllers \
              --follow-import-to=routeros \
              --follow-import-to=views \
              config_program/main.py

      - name: Relocate and Standardize Output Binary
        shell: bash
        run: |
          mkdir dist
          EXE="smalnets_${{ steps.version_info.outputs.version }}${{ matrix.label }}_${{ steps.version_info.outputs.arch }}.exe"
          mv build/main.exe "dist/${EXE}"

      - name: Attach Windows Executable to GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/smalnets_${{ steps.version_info.outputs.version }}${{ matrix.label }}_${{ steps.version_info.outputs.arch }}.exe
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Windows Executable to Server
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          HOST: ${{ secrets[matrix.deploy_host_secret] }}
          USER: ${{ secrets[matrix.deploy_user_secret] }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          V="${{ steps.version_info.outputs.version }}"
          ARCH="${{ steps.version_info.outputs.arch }}"
          EXE="smalnets_${V}${{ matrix.label }}_${ARCH}.exe"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p /var/www/smalnets/storage/app/public/releases/${{ github.ref_name }} && rm -f /var/www/smalnets/storage/app/public/releases/latest/*.exe"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "dist/${EXE}" "$USER@$HOST:/var/www/smalnets/storage/app/public/releases/${{ github.ref_name }}/"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "dist/${EXE}" "$USER@$HOST:/var/www/smalnets/storage/app/public/releases/latest/"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "ln -sf ../storage/app/public/releases /var/www/smalnets/public/releases"

  # =========================================================================
  # 🐧 LINUX COMPILATION JOB (Native Ubuntu Linux Hardware)
  # =========================================================================
  build-linux:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    name: Compile Branded Linux Packages (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [create-draft]
    strategy:
      matrix:
        include:
          - { variant: prod, label: '',      api: 'https://smalnets.com',      deploy_host_secret: PROD_HOST, deploy_user_secret: PROD_USER }
          - { variant: dev,  label: '-dev',  api: 'https://smalnets.ddns.net', deploy_host_secret: VPS_HOST,  deploy_user_secret: VPS_USER }

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Linux Python Environment (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install nFPM Packaging Core Engine
        run: |
          wget -q https://github.com/goreleaser/nfpm/releases/download/v2.35.0/nfpm_2.35.0_Linux_x86_64.tar.gz
          tar -xzf nfpm_2.35.0_Linux_x86_64.tar.gz nfpm
          sudo mv nfpm /usr/local/bin/
          rm nfpm_2.35.0_Linux_x86_64.tar.gz

      - name: Install Linux Compilation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev
          python -m pip install --upgrade pip
          pip install zstandard Nuitka PySide6 requests RouterOS-api

      - name: Create version file
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo -n "$V" > config_program/version.txt

      - name: Write build variant config
        run: |
          cat > config_program/build_config.py <<EOF
          BASE_URL = '${{ matrix.api }}'
          VARIANT = '${{ matrix.variant }}'
          EOF

      - name: Set version and arch for output naming
        id: version_info
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "arch=$(dpkg --print-architecture)" >> $GITHUB_OUTPUT

      - name: Patch nfpm.yaml with release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "
          import re
          v = '${{ steps.version_info.outputs.version }}'
          src = open('nfpm.yaml').read()
          src = re.sub(r'^version: .*', f'version: \"{v}\"', src, flags=re.MULTILINE)
          open('nfpm.yaml','w').write(src)
          "

      - name: Compile Code to C++ Binary via Nuitka
        run: |
          python -m nuitka --standalone \
              --onefile \
              --assume-yes-for-downloads \
              --plugin-enable=pyside6 \
              --windows-console-mode=disable \
              --output-dir=build \
              --include-data-files=assets/images/logo.png=assets/images/logo.png \
              --include-data-files=config_program/version.txt=version.txt \
              --include-module=build_config \
              --follow-import-to=api \
              --follow-import-to=controllers \
              --follow-import-to=routeros \
              --follow-import-to=views \
              config_program/main.py

      - name: Organize Linux Filesystem Tree Layout
        run: |
          mkdir -p build/pkg-root/usr/local/bin
          mkdir -p build/pkg-root/usr/share/applications
          mkdir -p build/pkg-root/usr/share/pixmaps
          mkdir -p build/pkg-root/usr/share/man/man1
          cp build/main.bin build/pkg-root/usr/local/bin/smalnets
          cp smalnets.desktop build/pkg-root/usr/share/applications/smalnets.desktop
          cp assets/images/logo.png build/pkg-root/usr/share/pixmaps/smalnets.png
          cp smalnets.1 build/pkg-root/usr/share/man/man1/

      - name: Generate ${{ matrix.variant }} DEB and RPM Installers
        run: |
          VERSION="${{ steps.version_info.outputs.version }}"
          ARCH="${{ steps.version_info.outputs.arch }}"
          mkdir dist
          nfpm pkg --config nfpm.yaml --target "dist/smalnets_${VERSION}${{ matrix.label }}_${ARCH}.deb"
          nfpm pkg --config nfpm.yaml --target "dist/smalnets-${VERSION}${{ matrix.label }}-1.${ARCH}.rpm"

      - name: Attach Linux Package Suite to GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smalnets_${{ steps.version_info.outputs.version }}${{ matrix.label }}_${{ steps.version_info.outputs.arch }}.deb
            dist/smalnets-${{ steps.version_info.outputs.version }}${{ matrix.label }}-1.${{ steps.version_info.outputs.arch }}.rpm
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old ${{ matrix.variant }} Linux packages from server
        if: startsWith(github.ref, 'refs/tags/')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -f /var/www/smalnets/storage/app/public/releases/${{ github.ref_name }}/*${{ matrix.label }}.deb
            rm -f /var/www/smalnets/storage/app/public/releases/${{ github.ref_name }}/*${{ matrix.label }}.rpm
            rm -f /var/www/smalnets/storage/app/public/releases/latest/*${{ matrix.label }}.deb
            rm -f /var/www/smalnets/storage/app/public/releases/latest/*${{ matrix.label }}.rpm

      - name: Deploy ${{ matrix.variant }} Linux Packages to Server
        if: startsWith(github.ref, 'refs/tags/')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/smalnets_${{ steps.version_info.outputs.version }}${{ matrix.label }}_${{ steps.version_info.outputs.arch }}.deb,dist/smalnets-${{ steps.version_info.outputs.version }}${{ matrix.label }}-1.${{ steps.version_info.outputs.arch }}.rpm
          target: /var/www/smalnets/storage/app/public/releases/${{ github.ref_name }}/
          strip_components: 1

      - name: Copy ${{ matrix.variant }} Linux Packages to Latest Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/smalnets_${{ steps.version_info.outputs.version }}${{ matrix.label }}_${{ steps.version_info.outputs.arch }}.deb,dist/smalnets-${{ steps.version_info.outputs.version }}${{ matrix.label }}-1.${{ steps.version_info.outputs.arch }}.rpm
          target: /var/www/smalnets/storage/app/public/releases/latest/
          strip_components: 1

      - name: Ensure public/releases symlink exists
        if: startsWith(github.ref, 'refs/tags/')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            ln -sf ../storage/app/public/releases /var/www/smalnets/public/releases

  # =========================================================================
  # 🍏 MACOS COMPILATION JOB (Native Apple Virtual Hardware)
  # =========================================================================
  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    name: Compile Branded macOS Installer (${{ matrix.variant }})
    runs-on: macos-14 # Targets modern Apple Silicon / M-series chips natively
    needs: [create-draft]
    strategy:
      matrix:
        include:
          - { variant: prod, label: '',      api: 'https://smalnets.com',      deploy_host_secret: PROD_HOST, deploy_user_secret: PROD_USER }
          - { variant: dev,  label: '-dev',  api: 'https://smalnets.ddns.net', deploy_host_secret: VPS_HOST,  deploy_user_secret: VPS_USER }

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up macOS Python Environment (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install macOS Compilation Dependencies and create-dmg tool
        run: |
          brew install create-dmg
          python -m pip install --upgrade pip
          pip install zstandard Nuitka PySide6 requests RouterOS-api

      - name: Create version file
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo -n "$V" > config_program/version.txt

      - name: Write build variant config
        run: |
          cat > config_program/build_config.py <<EOF
          BASE_URL = '${{ matrix.api }}'
          VARIANT = '${{ matrix.variant }}'
          EOF

      - name: Set version and arch for output naming
        id: version_info
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "arch=$(uname -m)" >> $GITHUB_OUTPUT

      - name: Convert App PNG Logo to macOS Native ICNS Format
        run: |
          mkdir -p logo.iconset
          sips -z 16 16     assets/images/logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32     assets/images/logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/images/logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64     assets/images/logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/images/logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256   assets/images/logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/images/logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512   assets/images/logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/images/logo.png --out logo.iconset/icon_512x512.png
          iconutil -c icns logo.iconset
          rm -rf logo.iconset

      - name: Compile Code to C++ via Nuitka
        run: |
          python -m nuitka --standalone \
              --onefile \
              --assume-yes-for-downloads \
              --plugin-enable=pyside6 \
              --windows-console-mode=disable \
              --output-dir=build \
              --include-data-files=assets/images/logo.png=assets/images/logo.png \
              --include-data-files=config_program/version.txt=version.txt \
              --include-module=build_config \
              --follow-import-to=api \
              --follow-import-to=controllers \
              --follow-import-to=routeros \
              --follow-import-to=views \
              config_program/main.py

      - name: Assemble Native macOS .app Bundle Layout
        run: |
          mkdir -p "dist/Smalnets.app/Contents/MacOS"
          mkdir -p "dist/Smalnets.app/Contents/Resources"
          cp build/main.bin "dist/Smalnets.app/Contents/MacOS/smalnets"
          cp Info.plist "dist/Smalnets.app/Contents/"
          cp logo.icns "dist/Smalnets.app/Contents/Resources/"
          chmod +x "dist/Smalnets.app/Contents/MacOS/smalnets"

      - name: Bundle into Branded DMG Installer file
        run: |
          VERSION="${{ steps.version_info.outputs.version }}"
          ARCH="${{ steps.version_info.outputs.arch }}"
          mkdir dmg-source
          mv dist/Smalnets.app dmg-source/
          create-dmg \
            --volname "Smalnets Installation Center" \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "Smalnets.app" 120 120 \
            --app-drop-link 370 120 \
            "dist/smalnets_${VERSION}${{ matrix.label }}_${ARCH}.dmg" \
            "dmg-source/"

      - name: Attach macOS Disk Image to GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/smalnets_${{ steps.version_info.outputs.version }}${{ matrix.label }}_${{ steps.version_info.outputs.arch }}.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy macOS Disk Image to Server
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          HOST: ${{ secrets[matrix.deploy_host_secret] }}
          USER: ${{ secrets[matrix.deploy_user_secret] }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          V="${{ steps.version_info.outputs.version }}"
          ARCH="${{ steps.version_info.outputs.arch }}"
          DMG="smalnets_${V}${{ matrix.label }}_${ARCH}.dmg"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p /var/www/smalnets/storage/app/public/releases/${{ github.ref_name }} && rm -f /var/www/smalnets/storage/app/public/releases/${{ github.ref_name }}/*${{ matrix.label }}.dmg /var/www/smalnets/storage/app/public/releases/latest/*${{ matrix.label }}.dmg"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "dist/${DMG}" "$USER@$HOST:/var/www/smalnets/storage/app/public/releases/${{ github.ref_name }}/"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "dist/${DMG}" "$USER@$HOST:/var/www/smalnets/storage/app/public/releases/latest/"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "ln -sf ../storage/app/public/releases /var/www/smalnets/public/releases"

  # =========================================================================
  # 🚀 PUBLISH JOB (flip the draft release to published after all installers
  #    are attached — required because immutable releases reject asset
  #    uploads to an already-published release)
  # =========================================================================
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Release (draft -> published)
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
          echo "Published ${{ github.ref_name }}"

  # =========================================================================
  # 🧹 SERVER STORAGE CLEANUP (keep max 5 releases on EACH server, runs after
  #    all builds)
  # =========================================================================
  cleanup-servers:
    if: startsWith(github.ref, 'refs/tags/')
    name: Cleanup Old Releases from Servers
    runs-on: ubuntu-latest
    needs: [publish-release]
    strategy:
      matrix:
        include:
          - { deploy_host_secret: VPS_HOST,  deploy_user_secret: VPS_USER }
          - { deploy_host_secret: PROD_HOST, deploy_user_secret: PROD_USER }

    steps:
      - name: Remove oldest releases beyond the 5 most recent
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/smalnets/storage/app/public/releases
            old_dirs=$(ls -dt v*/ 2>/dev/null | tail -n +6)
            if [ -n "$old_dirs" ]; then
              echo "Removing old releases:"
              for dir in $old_dirs; do
                echo "  - $dir"
                rm -rf "$dir"
              done
            else
              echo "No old releases to clean up"
            fi

      - name: Generate version manifest
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/smalnets/storage/app/public/releases
            python3 -c "import json,os; dirs=[d for d in os.listdir('.') if os.path.isdir(d) and d.startswith('v')]; dirs.sort(key=lambda d: os.path.getmtime(d), reverse=True); open('versions.json','w').write(json.dumps({'versions': dirs, 'latest': dirs[0] if dirs else ''}))"

      - name: Ensure public/releases symlink exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.deploy_host_secret] }}
          username: ${{ secrets[matrix.deploy_user_secret] }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            ln -sf ../storage/app/public/releases /var/www/smalnets/public/releases